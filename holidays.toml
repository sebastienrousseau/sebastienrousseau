# Holiday themes for the profile hero, in calendar order. This file is a
# source: tools/build.py renders a light and a dark hero per entry and
# writes assets/holidays.json, the calendar the clock Worker reads. Order
# matters: overlapping holidays alternate by the London hour in this order.
# docs/HOLIDAYS.md explains the rule grammar and the sources policy.

schema = 1
years = [2026, 2030]  # inclusive span the calendar must cover

[[holiday]]
key = "new-year"
name = "New Year's Day"
month = 1
rule = "fixed 01-01"
motif = "First light: sunrise coral, clear sky"
accent = { light = "#c2410c", dark = "#ffa07a" }
accent2 = { light = "#0369a1", dark = "#7cc8f0" }
