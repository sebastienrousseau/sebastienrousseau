# Not a package: the project table exists so uv can lock every tool the
# Makefile runs, with hashes, in uv.lock. version follows the release.
[project]
name = "sebastienrousseau"
version = "0.0.14"
requires-python = ">=3.12"
license = "Apache-2.0 OR MIT"
dependencies = []

[dependency-groups]
build = ["fonttools==4.68.0", "brotli==1.2.1"]
test = ["pytest==9.2.0", "pytest-cov==7.1.0", "radon==6.0.1"]
lint = ["ruff==0.17.4", "complexipy==8.3.0", "actionlint-py==1.7.12.25", "radon==6.0.1"]
audit = ["pip-audit==2.10.1"]

[tool.uv]
package = false
default-groups = []

[tool.ruff]
line-length = 120
target-version = "py312"
# tools/ modules import each other by bare name; treat them as first-party.
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C90", "PLR"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting is the idiom; bandit's S101 targets asserts in shipped code.
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 10

# The coverage floor is checked at this precision. With the default (0),
# pytest-cov rounds the total before comparing, so 86.93% passed a floor of
# 87 while printing FAIL.
[tool.coverage.report]
precision = 1
