<header class="masthead">
  <div class="lu-shell masthead-in">
    <a class="brand" href="{{root}}">
      <!-- The profile's clock, as on the hero panel, inlined so it cannot
           404. Decorative: the brand name follows it as text. -->
      <svg class="brand-mark" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 12V6.5M12 12l4 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <circle cx="12" cy="12" r="1.6" fill="currentColor" />
      </svg>
      <span class="brand-name">{{name}}</span>
    </a>

    <button
      class="nav-btn"
      type="button"
      id="nav-toggle"
      aria-expanded="false"
      aria-controls="site-nav"
    >{{label_menu}}</button>

    <nav class="site-nav" id="site-nav" aria-label="{{label_nav}}">
      <ul class="nav-list">
        <li><a href="{{root}}"{{!cur_manual}}>{{nav_manual}}</a></li>
        <li><a href="{{root}}data/"{{!cur_data}}>{{nav_data}}</a></li>
        <li><a href="{{profile_url}}">{{nav_profile}}</a></li>
        <li><a href="{{repo_url}}">{{nav_repo}}</a></li>
      </ul>
    </nav>

    <div class="masthead-tools">
      <!-- Search trigger slot: the generator replaces this element with its
           search button. -->
      <span data-ssg-search></span>
      <button class="theme-toggle" type="button" id="mode-toggle"
        data-label-light="{{label_theme_light}}"
        data-label-dark="{{label_theme_dark}}">
        <span class="visually-hidden">{{label_theme}}</span>
        <span class="visually-hidden" id="mode-state" data-label-system="{{label_theme_system}}">{{label_theme_system}}</span>
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
