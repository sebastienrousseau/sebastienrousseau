name: A panel looks wrong
description: An image on the profile is broken, mis-drawn, or says something untrue.
labels: [bug]
body:
  - type: input
    id: panel
    attributes:
      label: Which panel
      description: For example the hero clock, the numbers, or the kyberlib card.
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: What you see, and what you expected
      description: A screenshot helps. Say whether you use light or dark mode, and whether your system asks for reduced motion.
    validations:
      required: true
