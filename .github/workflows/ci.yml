name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Advisories appear without a code change, so the audit also runs weekly.
  schedule:
    - cron: "41 6 * * 1"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The single gate: lint and format (ruff, complexipy, ceilings,
      # shellcheck, actionlint), pytest with the coverage floor, and the
      # drift check that README.md and assets/ match a fresh build.
      # Offline apart from the pinned fonts: no token, no registry calls.
      - name: make check (lint, format, tests, README drift)
        run: make check
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Networked, so it stays out of the offline make check: every locked
      # dependency, hashes required, against known vulnerabilities.
      - name: pip-audit over uv.lock
        run: make audit
  test:
    # The tests on every supported Python, on Linux and macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: pytest on Python ${{ matrix.python-version }}
        run: make test
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # markdownlint-cli2 0.24.0, configured in .markdownlint-cli2.yaml.
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
